spring.application.name=environmental-impact-service
spring.datasource.url=${ENV_IMPACT_DB_URL:jdbc:mysql://localhost:3306/reloop_environmental_impact}
spring.datasource.username=${ENV_IMPACT_DB_USERNAME:root}
spring.datasource.password=${ENV_IMPACT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
